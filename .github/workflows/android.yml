name: Android CI

# Push-only: push-event runs attach their checks to open PRs, so no separate
# pull_request trigger is needed.
on:
  push:
    branches: [dev, main, "feat/**", "fix/**"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Every built commit pins its own versionCode via a trailer on the last
      # commit-message line: versionCode=N (digits only, must exceed the
      # current app/version.properties value). No trailer, no build -- except
      # merge commits, which rebuild an already-versioned tree as-is.
      - name: Resolve versionCode
        id: version
        run: |
          SUBJECT="$(git log -1 --format=%s HEAD)"
          LAST="$(git log -1 --format=%B HEAD | tail -n 1 | sed -e 's/[[:space:]]*$//')"
          FILE="$(grep '^VERSION_CODE=' app/version.properties | cut -d= -f2)"
          CODE=""
          case "$SUBJECT" in
            Merge\ *) echo "merge commit; reusing file versionCode=$FILE" ;;
            *)
              case "$LAST" in
                versionCode=*)
                  CANDIDATE="${LAST#versionCode=}"
                  if [[ "$CANDIDATE" =~ ^[0-9]+$ ]]; then CODE="$CANDIDATE"; fi
                  ;;
              esac
              if [ -z "$CODE" ]; then
                echo "ERROR: no versionCode=N trailer on the last commit-message line. End your commit with e.g. versionCode=$((FILE + 1))."
                exit 1
              fi
              if [ "$CODE" -le "$FILE" ]; then
                echo "ERROR: versionCode=$CODE is not greater than current $FILE; refusing to avoid a downgrade/overlap."
                exit 1
              fi
              ;;
          esac
          echo "code=${CODE:-$FILE}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # ubuntu-latest runners ship an SDK already; just ensure API 35 is present.
      - name: Ensure Android API 35 packages
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Run unit tests
        run: chmod +x gradlew && ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/

      # Debug APK only -- uses the pinned debug keystore, no signing cert needed.
      - name: Assemble debug APK
        run: chmod +x gradlew && ./gradlew :app:assembleDebug "-PversionCodeOverride=${{ steps.version.outputs.code }}" --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
