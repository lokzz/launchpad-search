name: Android CI

# Push-only: push-event runs attach their checks to open PRs, so no separate
# pull_request trigger is needed.
on:
  push:
    branches: [dev, main, "feat/**", "fix/**"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Every built commit pins its own versionCode via a trailer on the last
      # commit-message line: versionCode=N (digits only, must exceed the
      # current app/version.properties value). No trailer, no build -- except
      # merge commits, which rebuild an already-versioned tree as-is.
      - name: Resolve versionCode
        id: version
        run: |
          python3 - <<'EOF'
          import os
          import re, subprocess, sys
          msg = subprocess.run(
              ['git', 'log', '-1', '--format=%B', 'HEAD'],
              capture_output=True, text=True, check=True,
          ).stdout
          lines = msg.splitlines()
          subject = lines[0] if lines else ''
          last = lines[-1].strip() if lines else ''
          print(f'subject={subject!r}')
          print(f'last line={last!r}')
          props = {}
          with open('app/version.properties') as f:
              for line in f:
                  if line.startswith('VERSION_CODE='):
                      props['file'] = int(line.split('=', 1)[1].strip())
          file_code = props.get('file', 1001)
          print(f'file versionCode={file_code}')
          code = None
          if subject.startswith('Merge '):
              print(f'merge commit; reusing file versionCode={file_code}')
          else:
              m = re.fullmatch(r'versionCode=(\d+)', last)
              if m is None:
                  sys.exit(
                      'ERROR: no versionCode=N trailer on the last commit-message '
                      f'line (got {last!r}). End your commit with e.g. '
                      f'versionCode={file_code + 1}.'
                  )
              code = int(m.group(1))
              if code <= file_code:
                  sys.exit(
                      f'ERROR: versionCode={code} is not greater than current '
                      f'{file_code}; refusing to avoid a downgrade/overlap.'
                  )
          final = code if code is not None else file_code
          print(f'building with versionCode={final}')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'code={final}\n')
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # ubuntu-latest runners ship an SDK already; just ensure API 35 is present.
      - name: Ensure Android API 35 packages
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Run unit tests
        run: chmod +x gradlew && ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/

      # Debug APK only -- uses the pinned debug keystore, no signing cert needed.
      - name: Assemble debug APK
        run: chmod +x gradlew && ./gradlew :app:assembleDebug "-PversionCodeOverride=${{ steps.version.outputs.code }}" --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
